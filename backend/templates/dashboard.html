<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard</title>

    <link
        rel="stylesheet"
        href="/static/style.css?v=999"
    >

</head>

<body>

    <div class="container">

        <div class="dashboard">

            <h1>📊 Dashboard</h1>

            <p id="welcomeText">
                Welcome, User
            </p>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

            <!-- STATS -->

            <div class="stats">

                <div class="card">
                    <h2>Projects</h2>
                    <p id="projects">0</p>
                </div>

                <div class="card">
                    <h2>Total Tasks</h2>
                    <p id="tasks">0</p>
                </div>

                <div class="card">
                    <h2>My Tasks</h2>
                    <p id="myTasks">0</p>
                </div>

                <div class="card">
                    <h2>Completed</h2>
                    <p id="completed">0</p>
                </div>

            </div>

            <!-- CREATE TASK -->

            <div class="task-section">

                <h2>➕ Create Task</h2>

                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Enter task title"
                >

                <button onclick="createTask()">
                    Create Task
                </button>

            </div>

            <!-- TASK LIST -->

            <div class="task-section">

                <h2>📋 My Tasks</h2>

                <div id="taskList">

                    <!-- TASKS WILL LOAD HERE -->

                </div>

            </div>

        </div>

    </div>

    <script src="/static/app.js?v=999"></script>

</body>

</html>
